[project]
name = "octopus"
version = "0.1.0"
description = "Remote Claude Code controller"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10",
    # mcp 2.x renamed FastMCP (`mcp.server.fastmcp` -> `mcp.server.mcpserver`),
    # which the connector MCP servers import; the pin keeps a fresh install
    # working until that migration happens.
    "mcp>=1.0,<2",
    # crypto.py Fernet-encrypts every stored secret. It was missing from this
    # list, so a fresh install could not import server.crypto at all.
    "cryptography>=42",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
octopus = "server.cli:main"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
